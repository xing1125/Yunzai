# ComWeChat 适配器运行配置（由锅巴「ComWeChat」配置页写入 config/config/comwechat.yaml 覆盖）
# 群成员轮询间隔（秒）：定时拉各群成员列表差分，合成进群/退群事件。
# 默认 180(3分钟)。下限 30s、上限 600s(10分钟)。
# 群少且多为中小群可设小；同账号 ≥4 个大群建议回到 300(5分钟) 避免拖垮 COM 通道导致掉线。
memberWatchIntervalSec: 180
# 某群连续获取成员列表失败后的退避周期数（×间隔≈退避总时长）。默认 17 ≈ 180s×17≈51分钟。
memberWatchBackoffTicks: 17
# 单群成员列表拉取超时（毫秒）：大群经 COM 读全量成员列表常需 60~90s，原 45s 过短会每轮必败并触发退避。
# 默认 110000(110秒)，范围 30000~180000。放宽到大于大群真实耗时，让其能在超时前取回，避免级联拖垮其余群。
memberWatchGroupTimeoutMs: 110000
# 连续失败几次才进入退避：默认 3（范围 1~10）。原为「首次失败即退避」，对偶发 COM 抖动过于敏感（一次抖动黑掉 51 分钟）。
# 改为连续 N 次才退避，偶发超时只记一笔下轮重试，避免整片失效。
memberWatchBackoffAfter: 3
